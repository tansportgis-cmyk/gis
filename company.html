<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>طلباتي — منصة طلبات GIS</title>
  <meta name="theme-color" content="#1d6fe0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="boot" class="boot"><div class="spinner"></div></div>
  <header class="topbar" id="topbar"></header>

  <main class="container" id="main" hidden>
    <!-- قائمة الطلبات -->
    <section id="listView">
      <div class="page-head">
        <div>
          <h1 id="hello">طلباتي</h1>
          <p>تابع حالة طلباتك المقدمة لقسم GIS</p>
        </div>
        <button class="btn btn-primary fab" id="newBtn"></button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="tabs" id="tabs"></div>
      <div class="req-list" id="list"></div>
    </section>

    <!-- طلب جديد -->
    <section id="newView" hidden>
      <div class="page-head">
        <div><h1>إرسال طلب جديد</h1><p>سيصل الطلب لقسم GIS للمراجعة</p></div>
      </div>
      <form class="card form-card" id="newForm" novalidate>
        <label class="field"><span>نوع الطلب <i class="req">*</i></span><select name="type" id="typeSelect" required></select></label>
        <label class="field"><span>وصف الطلب <i class="req">*</i></span><textarea name="description" rows="4" placeholder="مثال: رفع بيانات شبكة مياه جديدة في مخطط الحي الشمالي" required></textarea></label>

        <div class="section-title" id="filesTitle"></div>
        <div id="picker"></div>

        <div class="section-title" id="mapTitle"></div>
        <div class="map tall" id="pickMap"></div>
        <div class="map-tools">
          <span id="locText">اضغط على الخريطة لتحديد الموقع (اختياري)</span>
          <span style="display:flex;gap:6px">
            <button type="button" class="btn btn-ghost btn-sm" id="clearLoc">مسح</button>
            <button type="button" class="btn btn-outline btn-sm" id="myLoc"></button>
          </span>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn"></button>
          <button type="button" class="btn btn-ghost" id="cancelNew">إلغاء</button>
        </div>
      </form>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/company.js"></script>
</body>
</html>
